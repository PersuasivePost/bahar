<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#1b1f23; --muted:#5b6670; --line:#d8dee4; --panel:#f6f8fa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181c; --fg:#e6eaee; --muted:#9aa5b0; --line:#2b333b; --panel:#1b2127; }
  }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.45 system-ui, sans-serif; }
  .app { display:grid; grid-template-columns: minmax(0,1fr) 380px; height:100%; }
  #map { height:100%; min-height:300px; }
  aside { overflow:auto; padding:14px 16px; border-left:1px solid var(--line); background:var(--panel); }
  h1 { font-size:16px; margin:0 0 6px; }
  .muted { color:var(--muted); font-size:13px; }
  .slider { padding:8px 0 12px; }
  .slider input { width:100%; }
  .answer { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; margin:8px 0; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
  details { margin-top:12px; } summary { cursor:pointer; font-weight:600; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td { padding:3px 4px; border-top:1px solid var(--line); vertical-align:top; }
  .wind { background:none; border:none; }
  .wind svg { transition: transform .2s; }
  .wind span { font:600 11px system-ui; background:var(--bg); color:var(--fg); border-radius:4px; padding:0 3px; }
  .leaflet-container { font:inherit; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height:auto; }
    html, body { height:auto; }
    aside { border-left:none; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <div id="map"></div>
  <aside>
    <h1 id="title"></h1>
    <div class="muted" id="query"></div>
    <div class="slider">
      <label for="hour"><b id="hourLabel"></b></label>
      <input type="range" id="hour" min="0" value="0" step="1">
      <div class="muted" id="wind"></div>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:hsl(120 60% 40%)"></i>high score</span>
      <span><i class="dot" style="background:hsl(0 65% 45%)"></i>low score</span>
      <span><i class="dot" style="background:#555"></i>blocked</span>
      <span>★ recommended</span>
    </div>
    <div class="answer" id="answer"></div>
    <details open><summary>Evidence</summary><table id="evidence"></table></details>
    <details><summary>Pollution sources shown</summary><div class="muted" id="srcnote"></div></details>
    <p class="muted" id="attr"></p>
  </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const S = {{ snap | tojson }};
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = t => esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)_(.+?)_(?=\s|$)/g,'$1<i>$2</i>')
  .replace(/ {2}\n|\n/g,'<br>');
const clock = iso => new Date(iso).toLocaleString('en-IN',
  {timeZone:'Asia/Kolkata', weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', hour12:false});
const slot = {}, wind = {};
S.slots.forEach(s => slot[s.venue_id + '|' + s.start] = s);
S.hourly.forEach(h => wind[h.venue_id + '|' + h.t] = h);
const color = s => !s || s.blocked ? '#555' : `hsl(${Math.round(s.score * 1.2)} 62% 42%)`;
const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const compass = d => COMPASS[Math.round(d / 22.5) % 16];

document.getElementById('title').textContent =
  S.activity + ' near ' + S.origin.name.split(',')[0];
document.getElementById('query').textContent = '“' + S.query + '”';
document.getElementById('answer').innerHTML = md(S.answer_text);
document.getElementById('attr').textContent = S.attribution + ' · Map tiles © OpenStreetMap contributors';
document.getElementById('evidence').innerHTML = S.evidence.filter(e => e.id[0] === 'e').map(e =>
  `<tr><td>${esc(e.id)}</td><td>${esc(e.label)}</td><td>${esc(e.value)}${e.unit ? ' ' + esc(e.unit) : ''}</td>
   <td class="muted">${esc(e.source)}</td></tr>`).join('');

const step = (name, fn) => { try { return fn(); } catch (e) { console.error('map step failed: ' + name, e); } };
const o = [S.origin.lat, S.origin.lon];
const map = L.map('map');
// A view must exist before any layer asks the map for projections (getBounds on a circle).
map.setView(o, 12);
step('tiles', () => L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map));
step('circle', () => {
  L.circle(o, {radius: S.radius_km * 1000, color:'#3b82f6', weight:1.5, fillOpacity:.04, dashArray:'6 6'}).addTo(map);
  L.circleMarker(o, {radius:6, color:'#fff', weight:2, fillColor:'#3b82f6', fillOpacity:1}).addTo(map)
    .bindTooltip('You: ' + S.origin.name.split(',')[0]);
  map.fitBounds(L.latLng(o).toBounds(S.radius_km * 2000).pad(0.05));
});

const markers = {};
step('venues', () => S.venues.forEach(v => {
  const best = v.id === S.best_venue_id;
  const m = L.circleMarker([v.lat, v.lon], {radius: best ? 12 : 8, weight: best ? 4 : 2, color: best ? '#111' : '#fff', fillOpacity: .95});
  m.addTo(map).on('click', () => { selected = v.id; draw(); });
  markers[v.id] = m;
}));

const srcLayer = L.layerGroup();
step('sources layer', () => srcLayer.addTo(map));
let selected = S.best_venue_id;
const venue = id => S.venues.find(v => v.id === id);

const arrowIcon = (deg, kmh) => L.divIcon({className:'wind', iconSize:[60,60], iconAnchor:[30,30], html:
  `<svg width="60" height="60" viewBox="-30 -30 60 60" style="transform:rotate(${deg}deg)">
     <path d="M0 -24 L9 -6 L3 -6 L3 22 L-3 22 L-3 -6 L-9 -6 Z" fill="#0ea5e9" stroke="#fff" stroke-width="1.5"/></svg>
   <span style="position:absolute;left:34px;top:22px">${Math.round(kmh)} km/h</span>`});
let windMarker = null;

const slider = document.getElementById('hour');
slider.max = S.hours.length - 1;
const bestSlot = S.slots.find(s => s.venue_id === S.best_venue_id && !s.blocked) || null;
const startIdx = bestSlot ? S.hours.indexOf(bestSlot.start) : -1;
slider.value = startIdx >= 0 ? startIdx : 0;
slider.addEventListener('input', draw);

function draw() {
  const t = S.hours[+slider.value];
  document.getElementById('hourLabel').textContent = 'Session start: ' + clock(t) + ' IST';
  step('venue colours', () => S.venues.forEach(v => {
    const s = slot[v.id + '|' + t], m = markers[v.id];
    if (!m) return;
    m.setStyle({fillColor: color(s), weight: v.id === selected ? 5 : (v.id === S.best_venue_id ? 4 : 2)});
    const why = s ? (s.blocked ? 'blocked: ' + (s.gates[0] ? s.gates[0].label : '') : 'score ' + Math.round(s.score)) : 'no data';
    m.bindTooltip(`${v.id === S.best_venue_id ? '★ ' : ''}${esc(v.name)}<br>${esc(why)}`);
  }));
  step('wind arrow', () => {
    const w = wind[S.best_venue_id + '|' + t];
    if (windMarker) windMarker.remove();
    windMarker = null;
    if (w) {
      // wind_dir_deg is where the wind comes FROM; the arrow points where it blows TO.
      const pos = [S.origin.lat + (S.radius_km / 111) * 0.8, S.origin.lon];
      windMarker = L.marker(pos, {icon: arrowIcon((w.wind_dir_deg + 180) % 360, w.wind_kmh), interactive: false, keyboard: false}).addTo(map);
      document.getElementById('wind').textContent =
        `Wind from ${compass(w.wind_dir_deg)} (${Math.round(w.wind_dir_deg)}°) at ${Math.round(w.wind_kmh)} km/h`;
    } else document.getElementById('wind').textContent = '';
  });
  step('pollution sources', drawSources);
}

function drawSources() {
  srcLayer.clearLayers();
  const v = venue(selected), list = S.sources[selected] || [];
  list.forEach(src => {
    const label = `${esc(src.name || src.cls)} (${esc(src.cls)}) · ${Math.round(src.distance_m)} m`;
    L.polyline([[v.lat, v.lon], [src.lat, src.lon]], {color:'#b45309', weight:1.5, dashArray:'3 5'}).addTo(srcLayer);
    L.circleMarker([src.lat, src.lon], {radius:6, color:'#b45309', weight:2, fillColor:'#f59e0b', fillOpacity:.9})
      .bindTooltip(label, {permanent: list.length <= 4, direction:'top'}).addTo(srcLayer);
  });
  const tag = selected === S.best_venue_id ? ' (recommended)' : selected === S.why_not_venue_id ? ' (the “why not” venue)' : '';
  document.getElementById('srcnote').textContent = list.length
    ? `Within 2 km of ${v.name}${tag}: ${list.length} grouped source(s), drawn at their nearest point. Click another venue to switch.`
    : `No road / industry / landfill sources mapped within 2 km of ${v.name}${tag}.`;
}
draw();
</script>
</body>
</html>
